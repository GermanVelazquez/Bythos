schema: spec-driven

context: |
  Tech stack: Go (bythos-desktop, module desktop/), React (desktop/ui, Vite), Kotlin/Gradle (mobile/android, planned)
  Architecture: Hexagonal-leaning single-binary desktop app (db / archivos / api / lan) plus a native Android client
  Testing: go test ./... (desktop), gradlew testDebugUnitTest (mobile/android, planned)
  Style: Spanish identifiers/comments in Go and UI code; English for SDD/OpenSpec artifacts

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
