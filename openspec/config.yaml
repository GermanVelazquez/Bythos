schema: spec-driven

sdd:
  artifact_store: hybrid

context: |
  Tech stack: Go 1.25 (bythos-desktop, module desktop/), React 18 (desktop/ui, Vite, pnpm), Kotlin/Gradle (mobile/android, minSdk 26, targetSdk 36), MV3 browser extension (extension/, plain JS), Go + Inno Setup installer (installer/)
  Architecture: Hexagonal-leaning single-binary desktop app (db / archivos / api / lan) plus a native Android client paired over LAN (QR, TLS pinning, Keystore token)
  Testing: go test ./... (run from desktop/), pnpm test = vitest run (run from desktop/ui/), ./gradlew testDebugUnitTest (run from mobile/android/); no tests for extension or installer; CI covers desktop Go + UI only; no workspace-level test command, so strict_tdd stays false
  Style: Spanish identifiers/comments in Go and UI code; English for SDD/OpenSpec artifacts

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
